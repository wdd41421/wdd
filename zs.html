<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>工地 - 主食配置</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{
            font-family: "Microsoft YaHei", sans-serif;
            padding: 6px;
        }
        h2{
            text-align: center;
            margin-bottom: 8px;
            font-size: 16px;
        }
        table{
            width: 100%;
            border-collapse: collapse;
        }
        th, td{
            border: 1px solid #ccc;
            padding: 4px 2px;   /* 行距适中 */
            text-align: center;
            font-size: 13px;
        }
        th{
            background: #f5f5f5;
        }

        /* ✅ 全部压缩列宽 */
        th.col-item   { width: 42px; }  /* 项目继续变窄 */
        th.col-small  { width: 45px; }  /* 人数/定量/总量统一 */

        input{
            width: 40px;      /* 输入框也同步压缩 */
            padding: 1px;
            font-size: 13px;
            text-align: center;
        }

        .btn-area{
            margin-top: 8px;
            text-align: right;
        }
        button{
            padding: 4px 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<h2>工地 - 主食配置（单位：斤）</h2>

<table>
    <thead>
    <tr>
        <th class="col-item">项目</th>
        <th class="col-small">人数</th>
        <th class="col-small">定量</th>
        <th class="col-small">总量</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>压面</td>
        <td><input type="number" id="ym_count" oninput="recalc()"></td>
        <td><input type="number" id="ym_unit" value="0.63" step="0.01" oninput="recalc()"></td>
        <td><input type="text"   id="ym_total" readonly></td>
    </tr>
    <tr>
        <td>刀削面</td>
        <td><input type="number" id="dxm_count" oninput="recalc()"></td>
        <td><input type="number" id="dxm_unit" value="0.63" step="0.01" oninput="recalc()"></td>
        <td><input type="text"   id="dxm_total" readonly></td>
    </tr>
    <tr>
        <td>炉面</td>
        <td><input type="number" id="lm_count" oninput="recalc()"></td>
        <td><input type="number" id="lm_unit" value="0.63" step="0.01" oninput="recalc()"></td>
        <td><input type="text"   id="lm_total" readonly></td>
    </tr>
    <tr>
        <td>炒饼</td>
        <td><input type="number" id="cb_count" oninput="recalc()"></td>
        <td><input type="number" id="cb_unit" value="0.63" step="0.01" oninput="recalc()"></td>
        <td><input type="text"   id="cb_total" readonly></td>
    </tr>
    <tr>
        <td>饺子</td>
        <td><input type="number" id="jz_count" oninput="recalc()"></td>
        <td><input type="number" id="jz_unit" value="1" step="0.01" oninput="recalc()"></td>
        <td><input type="text"   id="jz_total" readonly></td>
    </tr>
    </tbody>
</table>

<div class="btn-area">
    <button type="button" onclick="clearAll()">清空</button>
</div>

<script>
function calcRow(p) {
    var n = parseFloat(document.getElementById(p+"_count").value) || 0;
    var u = parseFloat(document.getElementById(p+"_unit").value)  || 0;
    var t = n * u;
    document.getElementById(p+"_total").value = t ? t.toFixed(2) : "";
}

function recalc() {
    calcRow("ym");
    calcRow("dxm");
    calcRow("lm");
    calcRow("cb");
    calcRow("jz");
}

function clearAll() {
    var rows = ["ym","dxm","lm","cb","jz"];
    for (var i=0;i<rows.length;i++){
        document.getElementById(rows[i]+"_count").value = "";
        document.getElementById(rows[i]+"_total").value = "";
    }

    // ✅ 定量恢复默认
    document.getElementById("ym_unit").value  = "0.63";
    document.getElementById("dxm_unit").value = "0.63";
    document.getElementById("lm_unit").value  = "0.63";
    document.getElementById("cb_unit").value  = "0.63";
    document.getElementById("jz_unit").value  = "1";

    recalc();
}
</script>

</body>
</html>
