<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>废品铜 / 铝电缆计算器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: #f2f4f8;
      color: #333;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(15, 35, 95, 0.12);
      padding: 32px 32px 28px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 14px; }
    .field-label {
      font-size: 14px;
      margin-bottom: 6px;
      display: block;
    }

    .input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #dde1eb;
      font-size: 14px;
      outline: none;
    }
    .input:focus {
      border-color: #2764ff;
      box-shadow: 0 0 0 2px rgba(39, 100, 255, 0.12);
    }

    .material-group {
      display: flex;
      gap: 14px;
      margin: 6px 0 18px;
    }
    .radio-pill {
      flex: 1;
      border-radius: 999px;
      border: 1px solid #dde1eb;
      padding: 8px 10px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .radio-pill input { display: none; }
    .radio-pill.active {
      background: #2764ff;
      color: #fff;
      border-color: #2764ff;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 999px;
      border: none;
      background: #2764ff;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      margin: 6px 0 18px;
      cursor: pointer;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .result-table th, .result-table td {
      border: 1px solid #e0e3ee;
      padding: 6px 8px;
      text-align: left;
    }
    .result-table th { background: #f6f7fb; }

    .summary {
      font-size: 13px;
      margin-top: 4px;
    }
    .summary .num {
      font-size: 15px;
      font-weight: 600;
      color: #2764ff;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="title">废品铜 / 铝电缆计算器</div>

      <!-- 输入区域 -->
      <div class="field">
        <label class="field-label">截面积（mm²）</label>
        <input id="area" type="number" class="input" placeholder="请输入电缆截面积" />
      </div>

      <div class="field">
        <label class="field-label">长度（m）</label>
        <input id="length" type="number" class="input" placeholder="请输入长度（米）" />
      </div>

      <div class="field">
        <label class="field-label">单价（元/斤）</label>
        <input id="unitPrice" type="number" class="input" placeholder="请输入单价（元/斤）" />
      </div>

      <div class="field">
        <label class="field-label">材质</label>
        <div id="materialGroup" class="material-group">
          <label class="radio-pill active">
            <input type="radio" name="m" value="copper" checked /> 铜
          </label>
          <label class="radio-pill">
            <input type="radio" name="m" value="aluminum" /> 铝
          </label>
        </div>
      </div>

      <button class="btn" id="calcBtn">计算</button>

      <!-- 结果区域 -->
      <table class="result-table">
        <tr><th>项目</th><th>结果</th></tr>
        <tr><td>截面积</td><td id="resArea">-</td></tr>
        <tr><td>长度</td><td id="resLength">-</td></tr>
        <tr><td>重量（斤）</td><td id="resWeight">-</td></tr>
        <tr><td>单价（元/斤）</td><td id="resUnitPrice">-</td></tr>
        <tr><td>总价（元）</td><td id="resTotalPrice">-</td></tr>
      </table>

      <div id="summary" class="summary">请先填写上面的数据，然后点击“计算”。</div>
    </div>
  </div>

  <script>
    // 材质按钮切换
    document.getElementById("materialGroup").addEventListener("click", function (e) {
      const label = e.target.closest(".radio-pill");
      if (!label) return;
      document.querySelectorAll(".radio-pill").forEach(el => el.classList.remove("active"));
      label.classList.add("active");
      label.querySelector("input").checked = true;
    });

    function fmt(n, d) {
      return isFinite(n) ? n.toFixed(d) : "-";
    }

    document.getElementById("calcBtn").onclick = function () {
      const area = parseFloat(document.getElementById("area").value);
      const length = parseFloat(document.getElementById("length").value);
      const unitPrice = parseFloat(document.getElementById("unitPrice").value);
      const material = document.querySelector("input[name=m]:checked").value;

      if (!area || !length || !unitPrice) {
        alert("请把截面积、长度、单价都填写完整！");
        return;
      }

      // 行业常用系数：先算 kg，再换算成斤
      const factor = material === "copper" ? 0.0089 : 0.0027;
      const weightKg = area * length * factor;   // kg
      const weightJin = weightKg * 2;            // 斤（1kg=2斤）

      // ✅ 总价按斤来算
      const totalPrice = weightJin * unitPrice;

      // 写入结果
      document.getElementById("resArea").textContent = area + " mm²";
      document.getElementById("resLength").textContent = length + " m";
      document.getElementById("resWeight").textContent = fmt(weightJin, 3) + " 斤";
      document.getElementById("resUnitPrice").textContent = unitPrice + " 元/斤";
      document.getElementById("resTotalPrice").textContent = fmt(totalPrice, 2) + " 元";

      const matText = material === "copper" ? "废铜" : "废铝";
      document.getElementById("summary").innerHTML =
        matText +
        "重量约 <span class=\"num\">" + fmt(weightJin, 3) +
        "</span> 斤，总价约 <span class=\"num\">" +
        fmt(totalPrice, 2) + "</span> 元。";
    };
  </script>
</body>
</html>
