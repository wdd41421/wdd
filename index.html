<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DD的工具小店</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 24px 32px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            text-align: center;
        }
        .title {
            margin: 0 0 24px;
            font-size: 26px;
            font-weight: 700;
        }

        .nav-list {
            display: flex;
            flex-direction: column;   /* 一列布局 */
            gap: 16px;
            margin: 0;
            padding: 0;
        }
        .nav-item a {
            display: block;
            padding: 14px 16px;
            text-decoration: none;
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid #e0d2ff;
            font-size: 17px;
            color: #5b21b6;
            transition: 0.18s;
        }
        .nav-item a:hover {
            background: #f5f3ff;
            border-color: #7c3aed;
            box-shadow: 0 6px 16px rgba(124,58,237,0.18);
            transform: translateY(-1px);
        }

        .hidden { display: none; }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .top-row h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        .back-btn {
            border: none;
            background: transparent;
            font-size: 13px;
            color: #6b7280;
            cursor: pointer;
            padding: 4px 8px;
        }
        .back-btn:hover {
            color: #111827;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="card">
        <h1 class="title">DD的工具小店</h1>

        <!-- 一级菜单：大分类 -->
        <div id="main-menu" class="nav-list"></div>

        <!-- 二级菜单：某个分类下的条目 -->
        <div id="sub-section" class="hidden">
            <div class="top-row">
                <button id="back-btn" class="back-btn">← 返回</button>
                <h2 id="cat-title"></h2>
                <span style="width:60px;"></span>
            </div>
            <div id="sub-menu" class="nav-list"></div>
        </div>
    </div>
</div>

<script>
    // 一级 & 二级菜单配置，只改这里
    const menuConfig = [
        {
            id: "tools",
            label: "计算工具",
            items: [
                { label: "比例计算工具", href: "bljs.html" },
                { label: "废品电缆米重", href: "fpdl.html" },
                { label: "税率计算工具", href: "sljs.html" },
                { label: "工地主食计算", href: "zs.html" },
                 { label: "数独解题", href: "sdjt.html" },
            ]
        },
        {
            id: "links",
            label: "网址导航",
            items: [
                { label: "GitHub", href: "https://github.com/" },
                { label: "百度", href: "https://www.baidu.com/" }
            ]
        }
    ];

    const mainMenuEl   = document.getElementById("main-menu");
    const subSectionEl = document.getElementById("sub-section");
    const subMenuEl    = document.getElementById("sub-menu");
    const catTitleEl   = document.getElementById("cat-title");
    const backBtn      = document.getElementById("back-btn");

    // 渲染一级菜单
    function renderMain() {
        mainMenuEl.innerHTML = "";
        menuConfig.forEach(cat => {
            const div = document.createElement("div");
            div.className = "nav-item";
            const a = document.createElement("a");
            a.textContent = cat.label;
            a.href = "javascript:void(0)";
            a.onclick = () => openCategory(cat.id);
            div.appendChild(a);
            mainMenuEl.appendChild(div);
        });
        mainMenuEl.classList.remove("hidden");
        subSectionEl.classList.add("hidden");
    }

    // 打开某个分类（二级菜单）
    function openCategory(id) {
        const cat = menuConfig.find(c => c.id === id);
        if (!cat) return;

        catTitleEl.textContent = cat.label;
        subMenuEl.innerHTML = "";

        cat.items.forEach(item => {
            const div = document.createElement("div");
            div.className = "nav-item";
            const a = document.createElement("a");
            a.textContent = item.label;
            a.href = item.href;
            div.appendChild(a);
            subMenuEl.appendChild(div);
        });

        mainMenuEl.classList.add("hidden");
        subSectionEl.classList.remove("hidden");
    }

    backBtn.onclick = renderMain;

    // ====== 手机右滑返回上一级 ======
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener("touchstart", function (e) {
        if (e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
        }
    }, { passive: true });

    document.addEventListener("touchend", function (e) {
        if (e.changedTouches.length === 1) {
            touchEndX = e.changedTouches[0].clientX;
            handleSwipe();
        }
    }, { passive: true });

    function handleSwipe() {
        const distance = touchEndX - touchStartX;

        // 右滑超过 80px 且从左侧 80px 内开始
        if (distance > 80 && touchStartX < 80) {
            // 只有在二级菜单页面时才返回
            if (!subSectionEl.classList.contains("hidden")) {
                renderMain();
            }
        }
    }

    // 初始化：先显示一级菜单
    renderMain();
</script>
</body>
</html>
