<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数独解题器（粘贴版）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 16px;
            background: #f5f5f5;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 20px;
            text-align: center;
            margin: 0 0 12px;
        }
        textarea {
            width: 100%;
            min-height: 140px;
            resize: vertical;
            font-size: 16px;
            line-height: 1.6;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        textarea[readonly] {
            background: #f8f8f8;
            resize: none; /* 结果框高度用 JS 自动调 */
        }
        .label {
            margin-top: 8px;
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        button {
            flex: 1;
            padding: 8px 0;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        #solveBtn {
            background: #007bff;
            color: #ffffff;
        }
        #clearBtn {
            background: #dddddd;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>数独解题器（粘贴版）</h1>

    <div class="label">输入题目（0 代表空格）</div>
    <textarea id="inputArea" placeholder="示例：
001200034
000005600
470000050
010320000
800007060
094000070
000800006
502009007
007000100"></textarea>

    <div class="btn-row">
        <button id="solveBtn">解题</button>
        <button id="clearBtn">清空</button>
    </div>

    <div class="label">解题结果（每 3 行一组）</div>
    <textarea id="outputArea" readonly placeholder="解出的结果会显示在这里"></textarea>

    <div class="note">
        说明：<br>
        • 支持 9 行 × 9 位 或 1 行 81 位输入<br>
        • 0 表示空格（未知数）<br>
        • 自动检测非法题目<br>
        • 判断：无解 / 唯一解 / 多解（至少 2 个解）<br>
        • 结果每 3 行自动分组显示，并显示解题用时
    </div>
</div>

<script>
    // 自动根据内容调整 textarea 高度
    function autoResize(el) {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
    }

    function parseInput() {
        const text = document.getElementById('inputArea').value.trim();
        if (!text) {
            alert("请输入题目（0 代表空格）");
            return null;
        }

        let grid = [];
        let lines = text.split(/\n+/).map(l => l.trim()).filter(l => l.length > 0);

        // 单行 81 位模式
        if (lines.length === 1) {
            const s = lines[0];
            if (s.length !== 81) {
                alert("单行模式必须是 81 个数字。");
                return null;
            }
            for (let r = 0; r < 9; r++) {
                grid[r] = [];
                for (let c = 0; c < 9; c++) {
                    const ch = s[r * 9 + c];
                    if (!/[0-9]/.test(ch)) return null;
                    grid[r][c] = parseInt(ch);
                }
            }
        }
        // 9 行 9 位模式
        else if (lines.length === 9) {
            for (let r = 0; r < 9; r++) {
                if (lines[r].length !== 9) return null;
                grid[r] = [];
                for (let c = 0; c < 9; c++) {
                    const ch = lines[r][c];
                    if (!/[0-9]/.test(ch)) return null;
                    grid[r][c] = parseInt(ch);
                }
            }
        } else {
            alert("请输入 9 行或 1 行 81 位数字。");
            return null;
        }

        return isInitialValid(grid) ? grid : null;
    }

    // 初始题目合法性检查：行/列/宫不能有冲突
    function isInitialValid(grid) {
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                const num = grid[r][c];
                if (num === 0) continue;
                grid[r][c] = 0;
                if (!isValid(grid, r, c, num)) {
                    alert("题目存在冲突！");
                    grid[r][c] = num;
                    return false;
                }
                grid[r][c] = num;
            }
        }
        return true;
    }

    // 简单合法性判断（用于初检）
    function isValid(grid, row, col, num) {
        for (let i = 0; i < 9; i++) {
            if (grid[row][i] === num || grid[i][col] === num) return false;
        }
        const sr = Math.floor(row / 3) * 3;
        const sc = Math.floor(col / 3) * 3;
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) {
                if (grid[sr + r][sc + c] === num) return false;
            }
        }
        return true;
    }

    // 高速求解 + 判断是否唯一解：MRV + 位运算
    function solveAndCheckUnique(grid) {
        const rows = new Array(9).fill(0);
        const cols = new Array(9).fill(0);
        const boxes = new Array(9).fill(0);
        const empties = [];

        function boxIndex(r, c) {
            return (r / 3 | 0) * 3 + (c / 3 | 0);
        }

        // 初始化 bit 掩码和空格列表
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                const v = grid[r][c];
                if (v === 0) {
                    empties.push({ r, c });
                } else {
                    const bit = 1 << v;
                    const b = boxIndex(r, c);
                    rows[r] |= bit;
                    cols[c] |= bit;
                    boxes[b] |= bit;
                }
            }
        }

        function bitCount(x) {
            let cnt = 0;
            while (x) {
                x &= (x - 1);
                cnt++;
            }
            return cnt;
        }

        let solutions = 0;
        let firstSolution = null;
        let multiple = false;

        function backtrack() {
            if (multiple) return;

            // 选一个候选数最少的空格（MRV）
            let bestIdx = -1;
            let bestMask = 0;
            let minCount = 10;

            for (let i = 0; i < empties.length; i++) {
                const { r, c } = empties[i];
                if (grid[r][c] !== 0) continue;

                const b = boxIndex(r, c);
                const used = rows[r] | cols[c] | boxes[b];
                let candMask = (~used) & 0x3FE; // 只保留 1~9 位（0b11_1111_1110）

                const cnt = bitCount(candMask);
                if (cnt === 0) {
                    return; // 死路
                }
                if (cnt < minCount) {
                    minCount = cnt;
                    bestIdx = i;
                    bestMask = candMask;
                    if (cnt === 1) break; // 已经最优，不用再找
                }
            }

            // 没有空格了，说明找到一个完整解
            if (bestIdx === -1) {
                solutions++;
                if (!firstSolution) {
                    firstSolution = grid.map(row => row.slice());
                }
                if (solutions >= 2) {
                    multiple = true; // 至少 2 个解，非唯一
                }
                return;
            }

            const { r, c } = empties[bestIdx];
            const b = boxIndex(r, c);

            // 遍历候选数字（根据 bestMask）
            for (let num = 1; num <= 9; num++) {
                const bit = 1 << num;
                if ((bestMask & bit) === 0) continue;

                grid[r][c] = num;
                rows[r] |= bit;
                cols[c] |= bit;
                boxes[b] |= bit;

                backtrack();

                grid[r][c] = 0;
                rows[r] &= ~bit;
                cols[c] &= ~bit;
                boxes[b] &= ~bit;

                if (multiple) return;
            }
        }

        backtrack();

        return {
            count: solutions,
            solution: firstSolution,
            multiple: multiple
        };
    }

    // 输出：带序号 + 3×3 分组 + 解的情况 + 用时
    function writeOutput(grid, count, multiple, msUsed) {
        let lines = [];

        for (let r = 0; r < 9; r++) {
            const rowStr = grid[r].join('');
            const formatted =
                (r + 1) + '、 ' +
                rowStr.slice(0, 3) + ' ' +
                rowStr.slice(3, 6) + ' ' +
                rowStr.slice(6, 9);

            lines.push(formatted);

            if ((r + 1) % 3 === 0 && r !== 8) {
                lines.push(""); // 每 3 行空一行
            }
        }

        lines.push(""); // 与正文隔一行

        let msg = "";
        if (count === 0) {
            msg = "解的情况：无解";
        } else if (count === 1 && !multiple) {
            msg = "解的情况：唯一解";
        } else if (multiple && count >= 2) {
            msg = "解的情况：多解（至少 2 个解，非唯一解）";
        } else {
            msg = "解的情况：至少 " + count + " 个解";
        }
        lines.push(msg);

        const seconds = (msUsed / 1000).toFixed(3);
        lines.push("用时：" + seconds + " 秒");

        const output = document.getElementById('outputArea');
        output.value = lines.join("\n");
        autoResize(output);
    }

    document.getElementById('solveBtn').addEventListener('click', function () {
        const grid = parseInput();
        if (!grid) return;

        const copy = grid.map(row => row.slice());

        const t0 = performance.now();
        const result = solveAndCheckUnique(copy);
        const t1 = performance.now();
        const used = t1 - t0;

        const output = document.getElementById('outputArea');

        if (result.count === 0 || !result.solution) {
            alert("此题无解（在搜索范围内未找到任何解）");
            output.value = "";
            autoResize(output);
            return;
        }

        writeOutput(result.solution, result.count, result.multiple, used);
    });

    document.getElementById('clearBtn').addEventListener('click', function () {
        document.getElementById('inputArea').value = "";
        const output = document.getElementById('outputArea');
        output.value = "";
        output.style.height = '140px'; // 清空时恢复默认高度
    });
</script>
</body>
</html>
